<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>Prvky 3D – periodická soustava</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='9' fill='%23ff5a6e'/%3E%3Cg fill='none' stroke='%2366f0ff' stroke-width='5'%3E%3Cellipse cx='50' cy='50' rx='44' ry='16'/%3E%3Cellipse cx='50' cy='50' rx='44' ry='16' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='44' ry='16' transform='rotate(120 50 50)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03040a;
    --ink: #e8f1ff;
    --muted: #8796b5;
    --line: rgba(140, 170, 255, 0.16);
    --glass: rgba(10, 14, 30, 0.62);
    --glass-strong: rgba(8, 11, 24, 0.86);
    --accent: #66f0ff;
    --accent2: #ff5a8a;
    --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button, select, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---------- skleněné panely ---------- */
  .glass {
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  /* ---------- horní lišta ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px; text-decoration: none; color: var(--ink);
  }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 50%, rgba(255, 90, 110, 0.55), transparent 35%), rgba(102, 240, 255, 0.08);
    border: 1px solid rgba(102, 240, 255, 0.35);
    font-size: 20px;
  }
  .brand b { font-size: 17px; letter-spacing: 0.02em; }
  .brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; padding: 7px 12px; border-radius: 10px; cursor: pointer;
    color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }
  .seg button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
  .seg button.on { color: #03141a; background: var(--accent); box-shadow: 0 0 18px rgba(102, 240, 255, 0.45); }

  .ctl { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; font-size: 13px; color: var(--muted); }
  .ctl select {
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 8px; color: var(--ink); font-size: 14px; outline: none; cursor: pointer;
  }
  .ctl select option { background: #0b1022; }
  #searchWrap { position: relative; padding: 0; }
  #search {
    width: 180px; background: transparent; border: 0; outline: none; padding: 9px 12px 9px 34px; font-size: 14px;
  }
  #searchWrap::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 18px; }
  #search::placeholder { color: var(--muted); }
  .spacer { flex: 1; }
  .iconbtn {
    width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; font-size: 17px;
    border-radius: 12px;
  }
  .iconbtn:hover { border-color: rgba(102, 240, 255, 0.5); }

  /* ---------- teplota ---------- */
  #tempBox {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 72px; z-index: 9;
    display: flex; align-items: center; gap: 14px; padding: 10px 16px; width: min(560px, calc(100vw - 28px));
  }
  #tempBox .tl { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #tempBox .tv { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 128px; text-align: right; white-space: nowrap; }
  #temp { flex: 1; accent-color: #ff9e3d; }
  #tempBox .phases { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
  #tempBox .phases i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
  #roomT { border: 1px solid var(--line); background: rgba(255,255,255,.05); border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; }

  /* ---------- legenda ---------- */
  #legend {
    position: fixed; left: 14px; right: 14px; margin: 0 auto; width: fit-content; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 9;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 5px;
  }
  #legend .chip {
    display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 9px; font-size: 13px; cursor: pointer;
    color: var(--ink); border: 1px solid transparent; transition: background .2s, opacity .2s, border-color .2s; white-space: nowrap;
    background: transparent;
  }
  #legend .chip:hover { background: rgba(255, 255, 255, 0.06); }
  #legend .chip.off { opacity: 0.35; }
  #legend .chip.pinned { border-color: currentColor; }
  #legend .dot { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 10px currentColor; background: currentColor; }
  #legend .chip span { color: var(--ink); }
  #legend .grad { display: flex; align-items: center; gap: 10px; padding: 4px 10px; font-size: 13px; }
  #legend .grad .bar { width: 220px; height: 10px; border-radius: 6px; }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 20; pointer-events: none; padding: 10px 12px; min-width: 150px;
    transform: translate(14px, 14px); font-size: 13px; line-height: 1.35; opacity: 0; transition: opacity .12s;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-h { display: flex; align-items: baseline; gap: 8px; }
  #tooltip .tt-s { font-size: 24px; font-weight: 700; }
  #tooltip .tt-n { font-weight: 600; font-size: 15px; }
  #tooltip .tt-z { color: var(--muted); }
  #tooltip .tt-r { color: var(--muted); }
  #tooltip .tt-v { margin-top: 3px; color: var(--ink); font-weight: 600; }

  #hint {
    position: fixed; left: 50%; top: 82px; transform: translateX(-50%); z-index: 8; font-size: 14px; color: var(--muted);
    padding: 8px 16px; border-radius: 999px; transition: opacity 1s; white-space: nowrap;
  }

  /* ---------- atom: ovládání ---------- */
  #atomUI { position: fixed; z-index: 11; left: 14px; top: max(64px, calc(env(safe-area-inset-top) + 56px)); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 9px 14px; font-size: 14px; font-weight: 500;
    border-radius: 12px; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .btn:hover { border-color: rgba(102, 240, 255, 0.5); box-shadow: 0 0 18px rgba(102, 240, 255, 0.18); }
  .btn.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(102, 240, 255, 0.25); }
  .btn kbd { font: inherit; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .tools { display: flex; flex-direction: column; gap: 6px; }
  .navrow { display: flex; gap: 6px; }

  #atomLegend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); padding: 8px 12px; }
  #atomLegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  /* ---------- info panel ---------- */
  #panel {
    position: fixed; z-index: 12; right: 14px; top: max(14px, env(safe-area-inset-top)); bottom: 14px; width: 370px;
    overflow-y: auto; padding: 18px 18px 22px; transform: translateX(calc(100% + 30px)); transition: transform .55s cubic-bezier(.2,.8,.2,1);
    background: var(--glass-strong); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  #panel.open { transform: none; }
  .p-head { display: flex; gap: 14px; align-items: center; }
  .p-tile {
    width: 84px; height: 84px; border-radius: 14px; flex: none; position: relative;
    border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 38px; font-weight: 700;
    box-shadow: 0 0 26px -4px currentColor, inset 0 0 22px -8px currentColor;
    background: rgba(255,255,255,.03);
  }
  .p-tile .pz { position: absolute; top: 5px; left: 8px; font-size: 13px; font-weight: 600; opacity: .8; }
  .p-tile .ps { color: var(--ink); text-shadow: 0 0 18px currentColor; }
  .p-name { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .p-cat { display: inline-block; margin-top: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
  .p-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .p-conf { margin: 16px 0 6px; font-size: 19px; font-weight: 600; letter-spacing: .01em; }
  .p-conf small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
  .p-shells { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
  .p-shells span { font-size: 12px; padding: 3px 7px; border-radius: 7px; background: rgba(102,240,255,.08); border: 1px solid rgba(102,240,255,.2); font-variant-numeric: tabular-nums; }
  .p-shells span b { color: var(--accent); font-weight: 600; margin-right: 3px; }
  .p-pne { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .p-pne div { padding: 9px 8px; border-radius: 11px; background: rgba(255,255,255,.04); border: 1px solid var(--line); text-align: center; }
  .p-pne b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .p-pne span { font-size: 11px; color: var(--muted); }
  .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .p-grid div { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .p-grid span { display: block; font-size: 11px; color: var(--muted); }
  .p-grid b { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .p-fact { margin: 14px 0 4px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; background: linear-gradient(135deg, rgba(102,240,255,.08), rgba(255,90,138,.06)); border: 1px solid var(--line); }
  .p-fact::before { content: "💡 "; }
  .p-sec { margin: 18px 0 8px; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  .p-sec button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 11px; letter-spacing: .04em; text-transform: none; padding: 0; }
  .boxes { display: flex; flex-direction: column; gap: 6px; }
  .bx-row { display: flex; align-items: center; gap: 8px; }
  .bx-row > span { width: 30px; font-size: 13px; color: var(--muted); text-align: right; font-weight: 600; }
  .bx-row .cells { display: flex; gap: 2px; }
  .bx-row .cell { width: 24px; height: 26px; border: 1px solid rgba(255,255,255,.22); border-radius: 4px; display: grid; place-items: center; font-size: 15px; line-height: 1; letter-spacing: -2px; }
  .p-note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.45; }
  #panelClose { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: none; }

  /* ---------- čipy orbitalů ---------- */
  #chips {
    position: fixed; z-index: 11; left: 14px; right: 398px; bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; pointer-events: none;
  }
  #chips .wrap { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; justify-content: center; max-width: 820px; }
  #chips button {
    border: 1px solid transparent; border-radius: 9px; padding: 5px 9px; background: rgba(255,255,255,.04); cursor: pointer; font-size: 13px; font-weight: 600;
    transition: opacity .2s, border-color .2s;
  }
  #chips { flex-direction: column; align-items: center; gap: 6px; }
  #chips button.off { opacity: .3; }
  #chips button.pick { border-color: currentColor; background: rgba(255,255,255,.1); }
  #chips .cap { font-size: 13px; color: var(--muted); padding: 7px 12px; }
  #chips button:hover { border-color: currentColor; }
  #chips .lead { font-size: 12px; color: var(--muted); align-self: center; padding: 0 6px; }
  #chips .opt { color: var(--ink); font-weight: 500; }

  /* ---------- štítky slupek ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #labels div {
    position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;
    padding: 2px 7px; border-radius: 6px; background: rgba(3, 5, 14, 0.55); border: 1px solid rgba(255,255,255,.12); color: var(--ink);
    transition: opacity .3s;
  }
  #labels .nuc { color: #ffb3bd; border-color: rgba(255, 90, 110, .35); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; z-index: 13; left: calc(50% - 192px); bottom: 90px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    padding: 12px 16px; font-size: 14px; line-height: 1.45; max-width: min(560px, calc(100vw - 420px)); transition: opacity .4s, transform .4s; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin: 0 4px; box-shadow: 0 0 12px currentColor; background: currentColor; }

  /* ---------- načítání ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .9s;
  }
  #loader .in { text-align: center; }
  #loader .atom { width: 90px; height: 90px; margin: 0 auto 18px; position: relative; }
  #loader .atom::before { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #ff5a6e; box-shadow: 0 0 20px #ff5a6e; }
  #loader .orb { position: absolute; inset: 0; border: 2px solid rgba(102,240,255,.7); border-radius: 50%; animation: spin 1.6s linear infinite; }
  #loader .orb:nth-child(1) { transform: rotateX(70deg); }
  #loader .orb:nth-child(2) { transform: rotateY(70deg) rotateX(20deg); animation-duration: 2.1s; }
  #loader .orb:nth-child(3) { transform: rotateX(70deg) rotateY(60deg); animation-duration: 2.7s; }
  @keyframes spin { to { rotate: 1turn; } }
  #loader p { color: var(--muted); font-size: 14px; letter-spacing: .08em; }
  #loader .err { color: #ff8a9a; max-width: 360px; }

  /* ---------- mobil ---------- */
  @media (max-width: 860px) {
    #topbar { gap: 6px; padding-left: 10px; padding-right: 10px; }
    .brand small { display: none; }
    .seg button { padding: 6px 9px; font-size: 13px; }
    #search { width: 120px; }
    .ctl { padding-left: 8px; }
    .ctl label { display: none; }
    #tempBox { bottom: auto; top: 148px; flex-wrap: wrap; gap: 6px 12px; }
    #tempBox .phases { width: 100%; justify-content: center; }
    #legend { bottom: max(8px, env(safe-area-inset-bottom)); padding: 4px; gap: 2px; }
    #legend .chip { padding: 4px 7px; font-size: 11px; }
    #legend .grad .bar { width: 140px; }
    #hint { top: auto; bottom: 130px; font-size: 13px; }

    #panel {
      left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 52vh;
      transform: translateY(calc(100% + 30px)); padding-top: 14px;
    }
    #panel.open { transform: none; }
    #panel.mini { max-height: 104px; overflow: hidden; }
    #panelClose { display: grid; place-items: center; }
    .p-tile { width: 64px; height: 64px; font-size: 28px; }
    .p-name { font-size: 22px; }
    #atomUI {
      top: calc(max(10px, env(safe-area-inset-top)) + 50px); left: 0; right: 0; padding: 0 8px 4px;
      flex-direction: row; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none;
    }
    #atomUI::-webkit-scrollbar { display: none; }
    #atomUI > * { flex: none; }
    .tools, .navrow { flex-direction: row; flex-wrap: nowrap; gap: 6px; }
    .btn { padding: 7px 10px; font-size: 13px; white-space: nowrap; }
    .seg button { white-space: nowrap; }
    .btn kbd, #atomLegend { display: none; }
    #chips { right: 8px; left: 8px; bottom: 122px; }
    #chips .wrap { max-height: 96px; overflow-y: auto; }
    #chips .cap { font-size: 12px; }
    #toast { left: 50%; bottom: auto; top: 112px; max-width: calc(100vw - 24px); font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="topbar">
  <a class="brand glass" href="../index.html" title="Zpět na PxSandbox">
    <span class="logo">⚛</span>
    <span><b>Prvky 3D</b><small>periodická soustava</small></span>
  </a>
  <div id="tableControls" style="display:contents">
    <div class="seg glass" id="layouts">
      <button data-l="table" class="on" title="Klasická tabulka (1)">Tabulka</button>
      <button data-l="bars" title="3D sloupcový graf vybrané vlastnosti (2)">Sloupce</button>
      <button data-l="spiral" title="Periody navinuté do spirály (3)">Spirála</button>
      <button data-l="cylinder" title="Tabulka stočená do válce (4)">Válec</button>
      <button data-l="sphere" title="Prvky na kouli (5)">Koule</button>
    </div>
    <div class="ctl glass">
      <label for="colorMode">Barvy</label>
      <select id="colorMode">
        <option value="cat">Kategorie</option>
        <option value="block">Bloky s · p · d · f</option>
        <option value="phase">Skupenství (teplota)</option>
        <option value="prop">Vlastnost</option>
      </select>
      <select id="prop" class="hidden" title="Vlastnost pro sloupce a barvy">
        <option value="m">Atomová hmotnost</option>
        <option value="en">Elektronegativita</option>
        <option value="d">Hustota</option>
        <option value="r">Atomový poloměr</option>
        <option value="ie">1. ionizační energie</option>
        <option value="mp">Teplota tání</option>
        <option value="bp">Teplota varu</option>
        <option value="y">Rok objevu</option>
      </select>
    </div>
    <div class="glass" id="searchWrap"><input id="search" type="search" placeholder="Hledat prvek či skupinu…" autocomplete="off" spellcheck="false"></div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn glass" id="soundBtn" title="Zvuk">🔊</button>
</div>

<div id="hint" class="glass">Klikni na prvek a nahlédni dovnitř atomu ✨</div>

<div id="tempBox" class="glass hidden">
  <span class="tl">🌡️ Teplota</span>
  <input id="temp" type="range" min="0" max="6000" step="1" value="298">
  <span class="tv" id="tempVal">298 K</span>
  <button id="roomT" title="Pokojová teplota">25 °C</button>
  <div class="phases">
    <span><i style="background:#cfe0ff"></i>pevné</span>
    <span><i style="background:#2f9bff"></i>kapalné</span>
    <span><i style="background:#ff7b45"></i>plynné</span>
    <span><i style="background:#555c70"></i>neznámé</span>
  </div>
</div>

<div id="legend" class="glass"></div>
<div id="tooltip" class="glass"></div>

<div id="atomUI" class="hidden">
  <button class="btn glass" id="backBtn">← Tabulka <kbd>Esc</kbd></button>
  <div class="seg glass" id="models">
    <button data-m="bohr" class="on" title="Bohrův model – elektrony na drahách (B)">Bohrův model</button>
    <button data-m="cloud" title="Kvantový model – orbitaly jako oblaka pravděpodobnosti (O)">Orbitaly</button>
  </div>
  <div class="tools">
    <button class="btn glass" id="exciteBtn" title="Vybudit elektron fotonem (mezerník)">✨ Vybudit elektron <kbd>␣</kbd></button>
    <button class="btn glass" id="nucleusBtn" title="Přiblížit jádro (J)">🔬 Zoom do jádra <kbd>J</kbd></button>
    <button class="btn glass" id="scaleBtn" title="Jádro ve skutečném měřítku (M)">📏 Skutečné měřítko <kbd>M</kbd></button>
    <button class="btn glass" id="phaseBtn" title="Barvit oblaka podle znaménka vlnové funkce" style="display:none">± Fáze ψ</button>
  </div>
  <div class="navrow">
    <button class="btn glass" id="prevBtn" title="Předchozí prvek (←)">◀</button>
    <button class="btn glass" id="tourBtn" title="Automatická prohlídka (P)">▶ Prohlídka</button>
    <button class="btn glass" id="nextBtn" title="Další prvek (→)">▶</button>
  </div>
  <div id="atomLegend" class="glass">
    <span><i style="background:#ff5a6e"></i>proton</span>
    <span><i style="background:#7c9cff"></i>neutron</span>
    <span><i style="background:#7ffbff"></i>elektron</span>
  </div>
</div>

<aside id="panel" class="glass"></aside>
<div id="chips" class="hidden"></div>
<div id="labels"></div>
<div id="toast" class="glass"></div>

<div id="loader"><div class="in">
  <div class="atom"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  <p id="loaderText">Skládám atomy…</p>
</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script>
  // když se modul nenačte (offline, blokované CDN), ať uživatel nekouká na věčné načítání
  window.addEventListener('error', (e) => {
    if (e.target && e.target.tagName === 'SCRIPT') {
      document.getElementById('loaderText').innerHTML = '<span class="err">Nepodařilo se načíst 3D knihovnu. Zkontroluj připojení k internetu a obnov stránku.</span>';
    }
  }, true);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
