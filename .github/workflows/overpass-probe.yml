name: Overpass probe (dočasné měření pro Pxplore)

on:
  push:
    branches: [ccr-56b863cf-ubvl25]
    paths: [.github/workflows/overpass-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Overpass endpoints
        run: |
          set +e
          LAT=50.0875; LNG=14.4213
          A="(around:800,$LAT,$LNG)"
          NEW='[out:json][timeout:20];(node["tourism"~"^(museum|gallery|artwork|viewpoint|attraction)$"]'$A';node["historic"]'$A';node["amenity"~"^(cafe|restaurant|fast_food|bar|pub|library|fountain|pharmacy|bank|atm|place_of_worship|school|university|college|cinema|theatre)$"]'$A';node["leisure"~"^(park|playground|garden)$"]'$A';node["shop"]'$A';way["leisure"~"^(park|playground|garden)$"]'$A';way["tourism"~"^(museum|gallery|artwork|viewpoint|attraction)$"]'$A';way["historic"]'$A';)->.mista;(node.mista(around:200,'$LAT,$LNG');way.mista(around:200,'$LAT,$LNG'););out center 120;(node.mista(around:400,'$LAT,$LNG');way.mista(around:400,'$LAT,$LNG'););out center 120;.mista out center 120;'
          OLD='[out:json][timeout:8];(node["tourism"]'$A';node["historic"]'$A';node["amenity"~"cafe|restaurant|fast_food|bar|pub|library|fountain|pharmacy|bank|atm|place_of_worship|school|university|college|cinema|theatre"]'$A';node["leisure"~"park|playground|garden"]'$A';node["shop"]'$A';way["leisure"~"park|playground|garden"]'$A';way["tourism"]'$A';way["historic"]'$A';);out center 120;'
          run_q() {
            label="$1"; url="$2"; q="$3"
            curl -sS -m 40 -o body.json -D headers.txt -w "HTTP %{http_code} | %{time_total}s | %{size_download} B\n" \
              -H 'Origin: https://jakub-klima.github.io' -H 'Referer: https://jakub-klima.github.io/px-sandbox/pxplore/' \
              --data-urlencode "data=$q" "$url" > meta.txt 2>&1
            echo "== $label → $url"
            cat meta.txt
            grep -i -E '^(access-control-allow-origin|retry-after|content-type)' headers.txt
            python3 -c "
          import json,sys
          try:
              j=json.load(open('body.json')); print('elements:',len(j.get('elements',[])),'| remark:',j.get('remark'))
          except Exception as e:
              print('non-JSON body:', open('body.json',errors='replace').read()[:300].replace('\n',' '))
          "
          }
          for url in https://overpass-api.de/api https://overpass.private.coffee/api https://overpass.kumi.systems/api; do
            echo "== status $url"
            curl -sS -m 15 "$url/status" | head -8
            echo
          done
          for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            run_q "NEW" "$url" "$NEW"; sleep 20
            run_q "OLD" "$url" "$OLD"; sleep 20
          done
          # opakování nového dotazu na hlavní server: jak je to stabilní
          for i in 1 2 3; do run_q "NEW #$i" https://overpass-api.de/api/interpreter "$NEW"; sleep 35; done
