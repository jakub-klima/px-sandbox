name: Overpass probe (dočasné měření pro Pxplore)

on:
  push:
    branches: [ccr-56b863cf-ubvl25]
    paths: [.github/workflows/overpass-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end Pxplore against real servers
        run: |
          set +e
          npm i --no-save playwright@1.56.1 >/dev/null 2>&1
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          cat > e2e.js <<'EOF'
          const { chromium } = require('playwright');
          async function run(label, lat, lng, waitExtrasMs) {
            const b = await chromium.launch({ channel: 'chrome' });
            const c = await b.newContext({ geolocation: { latitude: lat, longitude: lng }, permissions: ['geolocation'], viewport: { width: 390, height: 780 } });
            const p = await c.newPage();
            p.on('pageerror', e => console.log('PAGEERROR', e.message));
            await p.addInitScript(() => localStorage.setItem('pxplore.name', 'E2E'));
            const t0 = Date.now();
            await p.goto('http://127.0.0.1:8765/pxplore/index.html');
            try {
              await p.waitForFunction(() => { const c = JSON.parse(localStorage.getItem('pxplore.poiCache') || 'null'); return c && c.areas.length; }, null, { timeout: 30000 });
              console.log(`== ${label}: places in ${Date.now() - t0} ms`);
            } catch (e) { console.log(`== ${label}: NO PLACES within 30 s`); }
            await p.waitForTimeout(waitExtrasMs);
            const cache = await p.evaluate(() => JSON.parse(localStorage.getItem('pxplore.poiCache') || 'null'));
            if (cache) {
              const byType = {};
              for (const x of cache.places) byType[x.type] = (byType[x.type] || 0) + 1;
              console.log('types:', JSON.stringify(byType));
              console.log('sample:', cache.places.slice(0, 15).map(x => x.icon + ' ' + x.name).join(' | '));
              console.log('extra areas:', cache.extra.length);
            }
            await p.click('#hud'); await p.click('#hud-menu-diag');
            console.log(await p.textContent('#diag-text'));
            await p.screenshot({ path: label + '.png' });
            await b.close();
          }
          (async () => {
            await run('praha', 50.0875, 14.4213, 80000);
            await run('olomouc', 49.5938, 17.2509, 5000);
            await run('vesnice', 49.3000, 15.9000, 5000);
          })();
          EOF
          node e2e.js
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
