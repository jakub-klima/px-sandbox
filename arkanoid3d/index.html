<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arkanoid 3D – rozbíjej cihly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #04060c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body { display: flex; flex-direction: column; }
    #game { flex: 1 1 auto; width: 100%; min-height: 0; display: block; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; inset: 0 0 auto 0; z-index: 3;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 12px; gap: 10px;
      color: #d8f4ee; pointer-events: none;
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
    }
    #hud.hidden, #buffs.hidden { display: none; }
    #hud .box { display: flex; flex-direction: column; gap: 2px; }
    #hud .right { align-items: flex-end; }
    .big { font-size: 22px; font-weight: 800; letter-spacing: .02em; color: #7ffbe4; }
    .small { font-size: 12px; opacity: .75; }
    #lives { font-size: 15px; letter-spacing: 2px; }
    /* kolik bodů chybí do nejbližší příčky v tabulce */
    #chase { font-size: 12px; color: #ffd166; opacity: .95; }
    #chase:empty { display: none; }
    #chase b { font-weight: 800; }
    #combo {
      font-size: 14px; font-weight: 700; color: #ffd166; opacity: 0;
      transition: opacity .2s ease;
    }
    #combo.on { opacity: 1; }

    #buffs {
      position: fixed; left: 0; right: 0; bottom: 12px; z-index: 3;
      display: flex; justify-content: center; gap: 8px; pointer-events: none;
    }
    .buff.bad { border-color: rgba(255,80,110,.6); color: #ffc2ce; }
    .buff {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(0,0,0,.45); border: 1px solid rgba(0,255,200,.35); color: #b9fff0;
      backdrop-filter: blur(4px);
    }

    /* ---------- Tlačítka ---------- */
    .iconBtn {
      position: fixed; z-index: 6;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
      color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
    }
    .iconBtn:active { transform: scale(.94); }
    /* dole vlevo, ať nepřekrývají skóre ani životy */
    #soundBtn { left: 12px; bottom: 12px; }
    #pauseBtn { left: 62px; bottom: 12px; }

    #fireBtn {
      position: fixed; right: 16px; bottom: 74px; z-index: 6;
      width: 78px; height: 78px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,120,120,.55), rgba(120,0,40,.55));
      border: 2px solid rgba(255,140,140,.6); color: #fff;
      font-size: 26px; cursor: pointer; display: none;
    }
    #fireBtn.on { display: block; }
    #fireBtn:active { transform: scale(.93); }

    /* ---------- Překryv ---------- */
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 35%, rgba(0,60,60,.55), rgba(2,4,8,.92) 70%);
      backdrop-filter: blur(3px);
    }
    #overlay.hidden { display: none; }
    #panel {
      width: min(460px, 100%); text-align: center; color: #d8f4ee;
      background: rgba(5, 12, 18, .72);
      border: 1px solid rgba(0,255,200,.25);
      border-radius: 16px; padding: 22px 20px;
      backdrop-filter: blur(7px);
      box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 40px rgba(0,255,200,.12);
    }
    #panel h1 {
      font-size: 30px; letter-spacing: .04em; margin-bottom: 6px;
      background: linear-gradient(90deg, #7ffbe4, #a06bff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #panel h2 { font-size: 20px; margin-bottom: 8px; color: #7ffbe4; }
    #panel p { font-size: 14px; line-height: 1.55; opacity: .85; margin-bottom: 12px; }
    #panel .stats { font-size: 15px; margin-bottom: 14px; }
    #panel .stats b { color: #ffd166; }
    .keys { font-size: 13px; opacity: .7; margin-bottom: 14px; line-height: 1.7; }
    .keys code {
      background: rgba(255,255,255,.08); border-radius: 5px; padding: 1px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #panel button {
      display: block; width: 100%; margin: 8px 0 0;
      padding: 12px 16px; border-radius: 10px; cursor: pointer;
      font-size: 16px; font-weight: 700;
      background: rgba(0,255,200,.12); border: 1px solid rgba(0,255,200,.45); color: #d8f4ee;
    }
    #panel button:active { transform: scale(.98); }
    #panel button.ghost { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.18); font-weight: 500; }
    /* --- úvodní obrazovka --- */
    h1.logo {
      font-size: clamp(34px, 11vw, 52px); line-height: 1; margin-bottom: 10px;
      letter-spacing: .06em; font-weight: 900;
      background: linear-gradient(100deg, #7ffbe4 10%, #ffffff 35%, #a06bff 65%, #7ffbe4 90%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 6s linear infinite;
      filter: drop-shadow(0 0 22px rgba(0, 255, 200, .35));
    }
    @keyframes shine { to { background-position: -260% 0; } }
    .tag { font-size: 14px; opacity: .8; margin-bottom: 16px; }
    /* nejlepší tři výsledky na úvodní obrazovce */
    .scores {
      display: inline-grid; gap: 5px; margin-bottom: 18px; padding: 9px 16px;
      border-radius: 14px; font-size: 14px;
      border: 1px solid rgba(255, 209, 102, .4); color: #ffd166;
      background: rgba(255, 209, 102, .07);
    }
    .scores:empty { display: none; }
    .scores div { display: flex; align-items: baseline; gap: 10px; }
    .scores .pts { font-weight: 800; letter-spacing: .02em; margin-left: auto; }
    .scores .lvl { font-size: 12px; opacity: .6; min-width: 52px; text-align: right; }
    #panel button.primary {
      font-size: 19px; padding: 15px 16px; letter-spacing: .06em;
      background: linear-gradient(180deg, rgba(0,255,200,.22), rgba(0,255,200,.08));
      border-color: rgba(0,255,200,.65);
      box-shadow: 0 0 24px rgba(0,255,200,.18);
    }

    /* --- nápověda --- */
    .help { text-align: left; margin-bottom: 16px; }
    .help h3 {
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: #58c8b8; margin: 14px 0 6px;
    }
    .help .rows { display: grid; gap: 6px; font-size: 13px; line-height: 1.45; }
    .help .rows > div { display: flex; gap: 10px; align-items: baseline; opacity: .88; }
    .help .rows b { color: #7ffbe4; min-width: 84px; flex: 0 0 auto; }
    #panel { max-height: 88vh; overflow-y: auto; }
    /* v nápovědě zůstane tlačítko Zpět po ruce i při rolování */
    #panel button#ovBackBtn {
      position: sticky; bottom: -4px; margin-top: 16px;
      background: rgba(5, 12, 18, .96);
      border-color: rgba(0, 255, 200, .5);
    }

    @media (max-width: 560px) {
      .big { font-size: 26px; }
      #lives { font-size: 18px; }
      #soundBtn, #pauseBtn { width: 46px; height: 46px; font-size: 20px; }
      #pauseBtn { left: 68px; }
      #fireBtn { width: 88px; height: 88px; right: 14px; bottom: 88px; }
      #buffs { bottom: 18px; }
    }

    #bossBar {
      position: fixed; left: 50%; transform: translateX(-50%); top: 96px; z-index: 3;
      width: min(420px, 70vw); height: 12px; border-radius: 7px; display: none;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,60,110,.5); overflow: hidden;
    }
    #bossBar > span {
      display: block; height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff2f6d, #ffd166);
      transition: width .12s ease-out;
    }

    #banner {
      position: fixed; left: 0; right: 0; top: 15%; z-index: 5;
      text-align: center; pointer-events: none; opacity: 0;
    }
    #banner .lvl {
      font-size: 13px; letter-spacing: .35em; color: #7ffbe4; opacity: .85;
    }
    #banner .name {
      font-size: 34px; font-weight: 800; letter-spacing: .04em; color: #fff;
      text-shadow: 0 0 24px rgba(0,255,200,.55), 0 2px 8px rgba(0,0,0,.8);
    }
    #banner.show { animation: bannerIn 1.9s ease-out forwards; }
    @keyframes bannerIn {
      0% { opacity: 0; transform: translateY(14px) scale(.94); }
      18% { opacity: 1; transform: translateY(0) scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-10px) scale(1.02); }
    }

    table.board { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; }
    table.board td { padding: 4px 6px; border-bottom: 1px solid rgba(0,255,200,.12); text-align: left; }
    table.board td.num { text-align: right; font-weight: 700; color: #7ffbe4; }
    table.board tr.me td { color: #ffd166; }
    table.board tr.me td.num { color: #ffd166; }

    /* Poletující text (bonusy, kombo) */
    #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .floater {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 800; font-size: 18px; white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,.9);
      will-change: transform, opacity;
    }
    #flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: #fff; opacity: 0; transition: opacity .18s ease-out;
      mix-blend-mode: screen;
    }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 4;
      background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="floaters"></div>
  <div id="banner"><div class="lvl"></div><div class="name"></div></div>

  <div id="hud">
    <div class="box">
      <span class="small">SKÓRE</span>
      <span class="big" id="score">0</span>
      <span class="small">rekord <span id="best">0</span></span>
      <span id="chase"></span>
      <span id="combo">KOMBO ×1</span>
    </div>
    <div class="box right">
      <span class="small">KOLO</span>
      <span class="big" id="level">1</span>
      <span id="lives">❤️❤️❤️</span>
    </div>
  </div>

  <div id="buffs"></div>
  <div id="bossBar"><span></span></div>

  <button id="soundBtn" class="iconBtn" title="Zvuk">🔊</button>
  <button id="pauseBtn" class="iconBtn" title="Pauza">⏸</button>
  <button id="fireBtn" title="Střelba">🔫</button>

  <div id="overlay">
    <div id="panel">
      <h1 class="logo">ARKANOID 3D</h1>
      <p class="tag">Rozbij zeď, chytej bonusy, přežij Strážce.</p>
      <div class="scores" id="menuBest"></div>
      <button id="ovBtn" class="primary">▶&nbsp; HRÁT</button>
      <button id="ovFsBtn" class="ghost">📱 Na celou obrazovku</button>
      <button id="ovHelpBtn" class="ghost">Nápověda a ovládání</button>
    </div>
  </div>

  <template id="helpTpl">
    <h2>Jak na to</h2>
    <div class="help">
      <h3>Ovládání</h3>
      <div class="rows">
        <div><b>prst</b><span>táhni kdekoliv po ploše, pálka jede s tebou</span></div>
        <div><b>myš</b><span>pálka jde přesně pod kurzor</span></div>
        <div><b>← →</b><span>ovládání z klávesnice</span></div>
        <div><b>klik / mezerník</b><span>vypustí kouli podle zaměřovače, pak střílí laserem</span></div>
        <div><b>P</b><span>pauza &nbsp;·&nbsp; <b>R</b> nová hra</span></div>
      </div>

      <h3>Bonusy</h3>
      <div class="rows">
        <div><b>❤️</b><span>život navíc</span></div>
        <div><b>↔</b><span>širší pálka</span></div>
        <div><b>⋯</b><span>tři koule</span></div>
        <div><b>🐌</b><span>zpomalení koule</span></div>
        <div><b>🔫</b><span>laser</span></div>
        <div><b>🧲</b><span>lepkavá pálka – koule se chytí a dá se znovu zamířit</span></div>
        <div><b>🔻</b><span>červené hroty jsou riziko: body navíc za cenu užší pálky
          nebo rychlejší koule</span></div>
      </div>

      <h3>Co tě čeká</h3>
      <div class="rows">
        <div><b>🧱</b><span>cihly mají 1–3 zásahy, šedé jsou nerozbitné, červené vybuchnou</span></div>
        <div><b>🔥</b><span>pět cihel bez doteku pálky kouli zapálí a ta propaluje zeď</span></div>
        <div><b>🛸</b><span>rušiče od 3. kola sestřel koulí nebo laserem</span></div>
        <div><b>👁️</b><span>každé desáté kolo hlídá Strážce</span></div>
        <div><b>⏱️</b><span>když se dlouho nic nerozbije, zeď se přisune blíž</span></div>
      </div>
    </div>
    <button id="ovBackBtn">Zpět</button>
  </template>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

  // ======================================================================
  //  Arkanoid 3D – 1. iterace
  //  Hřiště leží vodorovně: pálka je vpředu (u hráče), cihly vzadu.
  //  Koule se pohybuje v rovině X/Z, kamera se dívá šikmo shora.
  // ======================================================================

  // ---------- Rozměry hřiště ----------
  const ARENA_W = 26;            // šířka (osa X: -13 .. +13)
  const ARENA_D = 36;            // hloubka (osa Z: -36 .. 0)
  const WALL_X = ARENA_W / 2;
  const BACK_Z = -ARENA_D;
  const PADDLE_Z = -4.2;         // pozice pálky
  const DEAD_Z = 1.5;            // za touto čarou je koule ztracená

  const BALL_R = 0.55;
  const BRICK_W = 2.9, BRICK_D = 1.6, BRICK_H = 0.9;
  const GAP = 0.18;        // mezera mezi sloupci
  const ROW_GAP = 0.55;    // mezera mezi řadami (kvůli výhledu na zadní řady)
  const COLS = 8;
  const ROW_Z0 = -31;            // nejvzdálenější řada

  const PADDLE_W_BASE = 5.4;
  const PADDLE_W_WIDE = 8.4;
  const PADDLE_W_NARROW = 3.5;
  const PADDLE_D = 1.3, PADDLE_H = 0.9;

  const SPEED_BASE = 22;
  const SPEED_MAX = 30;
  const MAX_BOUNCE_ANGLE = 1.05; // rad (~60°)
  const AIM_MAX = 0.95;          // rozsah kývání zaměřovače

  // ---------- Renderer, scéna, kamera ----------
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  (function skyBackground() {
    const c = document.createElement('canvas');
    c.width = 2; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#010206');
    grad.addColorStop(0.7, '#050b18');
    grad.addColorStop(1, '#0a1c2a');
    g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    scene.background = t;
  })();
  scene.fog = new THREE.Fog(0x04060c, 75, 210);

  const CAM_FOV = 52;
  const camera = new THREE.PerspectiveCamera(CAM_FOV, 1, 0.1, 260);
  const CAM_TARGET = new THREE.Vector3(0, 0.8, -14);
  const CAM_DIR = new THREE.Vector3(0, 0.66, 0.75).normalize(); // přepočítá se podle poměru stran
  let camDist = 40;

  // Rohy hřiště, které musí být vidět (kamera se podle nich odsune).
  const FIT_POINTS = [];
  for (const x of [-WALL_X - 1, WALL_X + 1])
    for (const z of [BACK_Z - 1, DEAD_Z + 2])
      for (const y of [0, 3]) FIT_POINTS.push(new THREE.Vector3(x, y, z));

  // Na výšku (mobil) se kamera zvedne víc nad hřiště, na šířku se položí níž –
  // tvar arény tak vyplní obrazovku v obou orientacích.
  function updateCamDir(aspect) {
    const t = Math.max(0, Math.min(1, (aspect - 0.62) / (1.25 - 0.62)));
    const ang = (64 - t * 23) * Math.PI / 180;
    CAM_DIR.set(0, Math.sin(ang), Math.cos(ang));
  }

  function fitCamera() {
    updateCamDir(camera.aspect);
    const ndc = new THREE.Vector3();
    camDist = 30;
    for (let i = 0; i < 70; i++) {
      camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, camDist);
      camera.lookAt(CAM_TARGET);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();
      let ok = true;
      for (const p of FIT_POINTS) {
        ndc.copy(p).project(camera);
        if (Math.abs(ndc.x) > 0.97 || Math.abs(ndc.y) > 0.96) { ok = false; break; }
      }
      if (ok) break;
      camDist *= 1.05;
    }
  }

  // ---------- Stupně kvality ----------
  // 2 = záře + plné rozlišení + stíny, 1 = bez záře, 0 = navíc bez stínů,
  // bez jisker a v základním rozlišení. Hra si stupeň sama změří a uloží.
  const urlParams = new URLSearchParams(location.search);
  const bloomParam = urlParams.get('bloom');
  const qParam = urlParams.get('q');
  let composer = null, bloomPass = null, bloomOn = false, quality = 2;

  function buildComposer() {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.8, 0.2);
    composer.addPass(bloomPass);
    composer.setSize(innerWidth, innerHeight);
  }

  function applyQuality(q, remember) {
    quality = q;
    bloomOn = bloomParam !== null ? bloomParam === '1' : q >= 2;
    if (bloomOn && !composer) buildComposer();
    renderer.setPixelRatio(q <= 0 ? 1 : Math.min(devicePixelRatio, 2));
    const wantShadows = q >= 1;
    if (renderer.shadowMap.enabled !== wantShadows) {
      renderer.shadowMap.enabled = wantShadows;
      scene.traverse(o => { if (o.isMesh && o.material) o.material.needsUpdate = true; });
    }
    if (typeof dust !== 'undefined' && dust) dust.visible = q >= 1;
    // na nejnižším stupni prořídne i zástavba – kryje velkou část obrazovky
    if (typeof cityMeshes !== 'undefined') {
      for (const c of cityMeshes) c.mesh.count = q <= 0 ? Math.ceil(c.full * 0.4) : c.full;
    }
    if (remember) { try { localStorage.setItem('arkanoid3d_quality', String(q)); } catch (e) {} }
  }

  function onResize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    if (composer) composer.setSize(w, h);
    camera.aspect = w / Math.max(1, h);
    fitCamera();
  }
  addEventListener('resize', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  // ---------- Světla ----------
  scene.add(new THREE.HemisphereLight(0x5fd6ff, 0x100a20, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.15);
  key.position.set(14, 34, 8);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -20; key.shadow.camera.right = 20;
  key.shadow.camera.top = 34; key.shadow.camera.bottom = -34;
  key.shadow.camera.near = 5; key.shadow.camera.far = 90;
  key.shadow.bias = -0.0009;
  key.target.position.set(0, 0, -20);
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight(0xa06bff, 0.45);
  rim.position.set(-16, 12, -40);
  scene.add(rim);


  // ---------- Procedurální textury ----------
  // Všechno se kreslí do canvasu za běhu: žádné externí soubory, ale materiály
  // mají albedo, emisní i normálovou mapu, takže povrchy nejsou ploché.
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h || w;
    return { c, g: c.getContext('2d') };
  }

  function canvasTexture(c, { srgb = false, repeat = null, aniso = 4 } = {}) {
    const t = new THREE.CanvasTexture(c);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    t.anisotropy = Math.min(aniso, maxAniso);
    return t;
  }

  // Normálová mapa ze stupňů šedi (Sobel) – dá povrchu reliéf bez modelování.
  function normalFromHeight(heightCanvas, strength = 2.2) {
    const w = heightCanvas.width, h = heightCanvas.height;
    const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
    const { c: out, g } = makeCanvas(w, h);
    const img = g.createImageData(w, h);
    const at = (x, y) => src[((((y % h) + h) % h) * w + (((x % w) + w) % w)) * 4] / 255;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (at(x - 1, y) - at(x + 1, y)) * strength;
        const dy = (at(x, y - 1) - at(x, y + 1)) * strength;
        const len = Math.hypot(dx, dy, 1);
        const i = (y * w + x) * 4;
        img.data[i] = (dx / len * 0.5 + 0.5) * 255;
        img.data[i + 1] = (dy / len * 0.5 + 0.5) * 255;
        img.data[i + 2] = (1 / len * 0.5 + 0.5) * 255;
        img.data[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return out;
  }

  function speckle(g, w, h, count, alpha) {
    for (let i = 0; i < count; i++) {
      g.fillStyle = `rgba(255,255,255,${(Math.random() * alpha).toFixed(3)})`;
      g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
  }

  const hex = n => '#' + n.toString(16).padStart(6, '0');
  function mixHex(a, b, t) {
    const ar = a >> 16 & 255, ag = a >> 8 & 255, ab = a & 255;
    const br = b >> 16 & 255, bg = b >> 8 & 255, bb = b & 255;
    return hex(((ar + (br - ar) * t) | 0) << 16 | ((ag + (bg - ag) * t) | 0) << 8 | ((ab + (bb - ab) * t) | 0));
  }

  // --- cihla: kovový rám, prosklený panel a svítící žebra ---
  function brickTextures(kind, info) {
    const S = 256, D = 128;   // panel je širší než hlubší
    const { c, g } = makeCanvas(S, D);
    const col = info.color;
    g.fillStyle = mixHex(col, 0x000000, 0.45);
    g.fillRect(0, 0, S, D);

    // rám se zkosením
    const bevel = g.createLinearGradient(0, 0, S * 0.3, D);
    bevel.addColorStop(0, mixHex(col, 0xffffff, 0.55));
    bevel.addColorStop(0.5, mixHex(col, 0xffffff, 0.08));
    bevel.addColorStop(1, mixHex(col, 0x000000, 0.35));
    g.fillStyle = bevel;
    g.fillRect(4, 4, S - 8, D - 8);

    // vnitřní panel
    const inner = g.createLinearGradient(0, 10, 0, D - 10);
    inner.addColorStop(0, mixHex(col, 0xffffff, 0.35));
    inner.addColorStop(1, mixHex(col, 0x000000, 0.18));
    g.fillStyle = inner;
    g.fillRect(18, 16, S - 36, D - 32);

    if (kind === 'X') {
      // nerozbitná: nýtovaný plech s křížovým šrafováním
      g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 2;
      for (let i = -D; i < S; i += 16) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i + D, D); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.22)';
      for (const [x, y] of [[26, 24], [S - 26, 24], [26, D - 24], [S - 26, D - 24]]) {
        g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill();
      }
    } else if (kind === 'E') {
      // výbušná: varovné pruhy a jádro
      g.save();
      g.beginPath(); g.rect(18, 16, S - 36, D - 32); g.clip();
      g.strokeStyle = 'rgba(255,220,80,.35)'; g.lineWidth = 10;
      for (let i = -D; i < S; i += 30) {
        g.beginPath(); g.moveTo(i, D); g.lineTo(i + D, 0); g.stroke();
      }
      g.restore();
      const core = g.createRadialGradient(S / 2, D / 2, 3, S / 2, D / 2, 34);
      core.addColorStop(0, 'rgba(255,255,255,.95)');
      core.addColorStop(1, 'rgba(255,60,90,0)');
      g.fillStyle = core;
      g.beginPath(); g.arc(S / 2, D / 2, 34, 0, 7); g.fill();
    } else {
      // běžná: tolik svítících žeber, kolik snese zásahů
      const n = parseInt(kind, 10);
      for (let i = 0; i < n; i++) {
        const y = D / 2 + (i - (n - 1) / 2) * 22;
        g.fillStyle = 'rgba(255,255,255,.30)';
        g.fillRect(34, y - 4, S - 68, 8);
        g.fillStyle = 'rgba(255,255,255,.55)';
        g.fillRect(34, y - 4, S - 68, 2);
      }
    }
    speckle(g, S, D, 900, 0.07);

    // emisní mapa: svítí obrys a žebra
    const { c: ec, g: eg } = makeCanvas(S, D);
    eg.fillStyle = '#000'; eg.fillRect(0, 0, S, D);
    eg.strokeStyle = hex(info.color); eg.lineWidth = 6;
    eg.strokeRect(9, 9, S - 18, D - 18);
    if (kind === 'E') {
      const core = eg.createRadialGradient(S / 2, D / 2, 2, S / 2, D / 2, 40);
      core.addColorStop(0, '#fff'); core.addColorStop(1, '#000');
      eg.fillStyle = core; eg.fillRect(0, 0, S, D);
    } else if (kind !== 'X') {
      const n = parseInt(kind, 10);
      eg.fillStyle = hex(info.color);
      for (let i = 0; i < n; i++) {
        const y = D / 2 + (i - (n - 1) / 2) * 22;
        eg.fillRect(34, y - 3, S - 68, 6);
      }
    }

    // výšková mapa pro reliéf (stačí poloviční)
    const HS = S / 2, HD = D / 2;
    const { c: hc, g: hg } = makeCanvas(HS, HD);
    hg.fillStyle = '#909090'; hg.fillRect(0, 0, HS, HD);
    hg.fillStyle = '#ffffff'; hg.fillRect(3, 3, HS - 6, HD - 6);
    hg.fillStyle = '#5a5a5a'; hg.fillRect(8, 7, HS - 16, HD - 14);
    hg.fillStyle = '#c8c8c8'; hg.fillRect(11, 10, HS - 22, HD - 20);
    if (kind !== 'X' && kind !== 'E') {
      const n = parseInt(kind, 10);
      hg.fillStyle = '#ffffff';
      for (let i = 0; i < n; i++) {
        const y = HD / 2 + (i - (n - 1) / 2) * 11;
        hg.fillRect(17, y - 2, HS - 34, 4);
      }
    }

    return {
      map: canvasTexture(c, { srgb: true, aniso: 8 }),
      emissiveMap: canvasTexture(ec, { srgb: true }),
      normalMap: canvasTexture(normalFromHeight(hc, 2.6))
    };
  }

  // --- podlaha: kovové dlaždice se svítícími spárami ---
  function floorTextures() {
    const S = 512;
    const { c, g } = makeCanvas(S);
    const base = g.createLinearGradient(0, 0, S, S);
    base.addColorStop(0, '#1d2d4d');
    base.addColorStop(1, '#141f36');
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // vnitřní dělení dlaždice
    g.strokeStyle = 'rgba(140,120,255,.22)'; g.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const p = i * S / 4;
      g.beginPath(); g.moveTo(p, 0); g.lineTo(p, S); g.stroke();
      g.beginPath(); g.moveTo(0, p); g.lineTo(S, p); g.stroke();
    }
    // rohové značky
    g.strokeStyle = 'rgba(0,255,210,.45)'; g.lineWidth = 3;
    for (const [x, y, dx, dy] of [[26, 26, 1, 1], [S - 26, 26, -1, 1], [26, S - 26, 1, -1], [S - 26, S - 26, -1, -1]]) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx * 26, y); g.moveTo(x, y); g.lineTo(x, y + dy * 26); g.stroke();
    }
    // svítící spára po obvodu
    g.strokeStyle = 'rgba(80,255,225,.75)'; g.lineWidth = 6;
    g.strokeRect(3, 3, S - 6, S - 6);
    speckle(g, S, S, 2600, 0.05);

    const HS = S / 2;   // reliéf stačí v poloviční hustotě
    const { c: hc, g: hg } = makeCanvas(HS);
    hg.fillStyle = '#cccccc'; hg.fillRect(0, 0, HS, HS);
    hg.strokeStyle = '#303030'; hg.lineWidth = 6;
    hg.strokeRect(3, 3, HS - 6, HS - 6);
    hg.strokeStyle = '#8a8a8a'; hg.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const p = i * HS / 4;
      hg.beginPath(); hg.moveTo(p, 0); hg.lineTo(p, HS); hg.stroke();
      hg.beginPath(); hg.moveTo(0, p); hg.lineTo(HS, p); hg.stroke();
    }

    // mapa drsnosti: spáry lesklejší než plocha
    const { c: rc, g: rg } = makeCanvas(S);
    rg.fillStyle = '#c0c0c0'; rg.fillRect(0, 0, S, S);
    rg.strokeStyle = '#404040'; rg.lineWidth = 8;
    rg.strokeRect(4, 4, S - 8, S - 8);

    const rep = [ARENA_W / 4, (ARENA_D + 8) / 4];
    return {
      map: canvasTexture(c, { srgb: true, repeat: rep, aniso: 16 }),
      normalMap: canvasTexture(normalFromHeight(hc, 1.8), { repeat: rep, aniso: 8 }),
      roughnessMap: canvasTexture(rc, { repeat: rep, aniso: 8 })
    };
  }

  // --- mantinel: broušený kov se svítícím pruhem ---
  function wallTextures() {
    const S = 256;
    const { c, g } = makeCanvas(S);
    g.fillStyle = '#1c5567'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 420; i++) {
      const y = Math.random() * S;
      g.strokeStyle = `rgba(255,255,255,${(Math.random() * 0.09).toFixed(3)})`;
      g.lineWidth = Math.random() * 2;
      g.beginPath(); g.moveTo(0, y); g.lineTo(S, y); g.stroke();
    }
    // příčné panelové spáry
    g.fillStyle = 'rgba(0,0,0,.45)';
    for (let x = 0; x < S; x += 64) g.fillRect(x, 0, 3, S);
    // svítící pruh
    g.fillStyle = 'rgba(120,255,235,.75)';
    g.fillRect(0, S * 0.12, S, S * 0.2);

    const { c: ec, g: eg } = makeCanvas(S);
    eg.fillStyle = '#000'; eg.fillRect(0, 0, S, S);
    eg.fillStyle = '#18c8b0'; eg.fillRect(0, S * 0.12, S, S * 0.2);

    const { c: hc, g: hg } = makeCanvas(S);
    hg.fillStyle = '#c8c8c8'; hg.fillRect(0, 0, S, S);
    hg.fillStyle = '#303030';
    for (let x = 0; x < S; x += 64) hg.fillRect(x, 0, 4, S);
    hg.fillStyle = '#ffffff'; hg.fillRect(0, S * 0.12 - 2, S, S * 0.2 + 4);

    return { c, ec, nc: normalFromHeight(hc, 1.6) };
  }

  // --- pálka: tmavý plášť se světelným jádrem ---
  function paddleTextures() {
    const W = 512, H = 128;
    const { c, g } = makeCanvas(W, H);
    g.fillStyle = '#1a4d5e'; g.fillRect(0, 0, W, H);
    const shell = g.createLinearGradient(0, 0, 0, H);
    shell.addColorStop(0, '#8ae6f5');
    shell.addColorStop(0.5, '#4fc2d8');
    shell.addColorStop(1, '#2e93ad');
    g.fillStyle = shell; g.fillRect(0, 6, W, H - 12);
    // jádro
    g.fillStyle = 'rgba(235,255,252,.97)';
    g.fillRect(20, H / 2 - 32, W - 40, 64);
    // koncové bloky
    g.fillStyle = '#3e9db5';
    g.fillRect(0, 0, 30, H); g.fillRect(W - 30, 0, 30, H);
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 3;
    for (let x = 40; x < W - 40; x += 40) {
      g.beginPath(); g.moveTo(x, 16); g.lineTo(x + 12, 16); g.stroke();
      g.beginPath(); g.moveTo(x, H - 16); g.lineTo(x + 12, H - 16); g.stroke();
    }
    speckle(g, W, H, 700, 0.05);

    const { c: ec, g: eg } = makeCanvas(W, H);
    eg.fillStyle = '#000'; eg.fillRect(0, 0, W, H);
    eg.fillStyle = '#ffffff'; eg.fillRect(20, H / 2 - 32, W - 40, 64);
    eg.fillStyle = 'rgba(255,255,255,.35)'; eg.fillRect(0, 0, W, H);
    eg.fillStyle = 'rgba(255,255,255,.45)'; eg.fillRect(0, H / 2 - 3, 30, 6);
    eg.fillStyle = 'rgba(255,255,255,.45)'; eg.fillRect(W - 30, H / 2 - 3, 30, 6);

    const { c: hc, g: hg } = makeCanvas(W, H);
    hg.fillStyle = '#8a8a8a'; hg.fillRect(0, 0, W, H);
    hg.fillStyle = '#e8e8e8'; hg.fillRect(0, 8, W, H - 16);
    hg.fillStyle = '#ffffff'; hg.fillRect(20, H / 2 - 33, W - 40, 66);
    hg.fillStyle = '#3a3a3a'; hg.fillRect(28, 0, 4, H); hg.fillRect(W - 32, 0, 4, H);

    return {
      map: canvasTexture(c, { srgb: true, aniso: 8 }),
      emissiveMap: canvasTexture(ec, { srgb: true }),
      normalMap: canvasTexture(normalFromHeight(hc, 2))
    };
  }

  // ---------- Pozadí: hvězdná kupole nad arénou ----------
  const skyTex = (function makeSkydome() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#01030a');
    grad.addColorStop(0.42, '#071235');
    grad.addColorStop(0.5, '#0a2739');
    grad.addColorStop(0.56, '#05161f');
    grad.addColorStop(1, '#01030a');
    g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
    // hvězdy v horní polovině
    for (let i = 0; i < 700; i++) {
      const x = Math.random() * 1024;
      const y = Math.pow(Math.random(), 0.75) * 250;
      const a = 0.2 + Math.random() * 0.75;
      g.fillStyle = `rgba(${180 + (Math.random() * 75 | 0)},${230 + (Math.random() * 25 | 0)},255,${a})`;
      const sz = Math.random() < 0.1 ? 2 : 1;
      g.fillRect(x, y, sz, sz);
    }
    // záře nad obzorem
    const glow = g.createLinearGradient(0, 214, 0, 258);
    glow.addColorStop(0, 'rgba(0,255,210,0)');
    glow.addColorStop(1, 'rgba(0,255,210,.16)');
    g.fillStyle = glow; g.fillRect(0, 214, 1024, 44);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(190, 32, 20),
      new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false })
    );
    dome.position.set(0, 0, BACK_Z / 2);
    scene.add(dome);
    return tex;
  })();

  // Odrazy prostředí z téže hvězdné oblohy – kov v aréně přestane být plochý.
  // Mapa se počítá až po prvním snímku a ze zmenšené předlohy, aby start hry
  // nečekal na několik set milisekund navíc.
  function buildEnvironment() {
    const small = makeCanvas(256, 128);
    small.g.drawImage(skyTex.image, 0, 0, 256, 128);
    const equi = new THREE.CanvasTexture(small.c);
    equi.mapping = THREE.EquirectangularReflectionMapping;
    equi.colorSpace = THREE.SRGBColorSpace;
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(equi).texture;
    pmrem.dispose();
    equi.dispose();
  }


  // ---------- Podlaha ze svítících dlaždic ----------
  const floorTex = floorTextures();
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA_W, ARENA_D + 8),
    new THREE.MeshStandardMaterial({
      map: floorTex.map,
      normalMap: floorTex.normalMap,
      normalScale: new THREE.Vector2(0.8, 0.8),
      roughnessMap: floorTex.roughnessMap,
      roughness: 0.8, metalness: 0.18, envMapIntensity: 0.5
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = BACK_Z / 2 + 3;
  floor.receiveShadow = true;
  scene.add(floor);

  // Okolí pod hřištěm – řídká mřížka, kterou mlha v dálce spolkne
  function outerGridTexture() {
    const { c, g } = makeCanvas(256);
    g.fillStyle = '#04060e'; g.fillRect(0, 0, 256, 256);
    // hlavní mřížka
    g.strokeStyle = 'rgba(110,140,255,.13)'; g.lineWidth = 3;
    g.strokeRect(2, 2, 252, 252);
    // jemnější vnitřní dělení
    g.strokeStyle = 'rgba(90,120,220,.06)'; g.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const q = i * 64;
      g.beginPath(); g.moveTo(q, 0); g.lineTo(q, 256); g.stroke();
      g.beginPath(); g.moveTo(0, q); g.lineTo(256, q); g.stroke();
    }
    // vodivé stopy jako na desce plošných spojů
    g.strokeStyle = 'rgba(0,255,210,.16)'; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(18, 240); g.lineTo(18, 150); g.lineTo(96, 72); g.lineTo(96, 16);
    g.moveTo(238, 30); g.lineTo(238, 120); g.lineTo(160, 198); g.lineTo(160, 244);
    g.stroke();
    // uzly
    for (const [x, y] of [[18, 150], [96, 72], [238, 120], [160, 198]]) {
      const rg = g.createRadialGradient(x, y, 0, x, y, 14);
      rg.addColorStop(0, 'rgba(120,255,235,.55)');
      rg.addColorStop(1, 'rgba(120,255,235,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill();
    }
    return canvasTexture(c, { srgb: true, repeat: [64, 64], aniso: 8 });
  }
  // ---------- Aréna jako plošina nad městem ----------
  // Dřív se kolem hřiště táhla plochá mřížka, což hlavně na výšku vypadalo
  // prázdně. Teď hřiště stojí na plošině a hned za jejím okrajem se propadá
  // pohled dolů do neonového města.
  const CITY_CENTER_Z = BACK_Z / 2 + 3;
  const CITY_Y = -46;                  // úroveň města hluboko pod arénou

  // Přibližná pozice kamery – nic z pozadí nesmí trčet těsně před objektiv.
  const CAM_SPOT = new THREE.Vector3(0, 26, 24);
  const farFromCamera = (x, y, z, min) =>
    CAM_SPOT.distanceToSquared(new THREE.Vector3(x, y, z)) > min * min;

  // Trup plošiny: tmavý kov se svítící hranou po obvodu
  {
    const hullTex = wallTextures();
    const hull = new THREE.Mesh(
      new THREE.BoxGeometry(ARENA_W + 3.6, 3.4, ARENA_D + 11),
      new THREE.MeshStandardMaterial({
        color: 0x7fa8b8,
        map: canvasTexture(hullTex.c, { srgb: true, repeat: [8, 1], aniso: 8 }),
        normalMap: canvasTexture(hullTex.nc, { repeat: [8, 1] }),
        normalScale: new THREE.Vector2(0.6, 0.6),
        emissive: 0x0d6f7e, emissiveIntensity: 0.35,

    const rim = new THREE.Mesh(

    );
    rim.position.set(0, -0.42, CITY_CENTER_Z);
    scene.add(rim);

    // podsvícení plošiny zespodu

      new THREE.PlaneGeometry(ARENA_W + 10, ARENA_D + 18),

  // Země města hluboko dole
  {
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(700, 700),
      new THREE.MeshBasicMaterial({ map: outerGridTexture(), color: 0xb9c8ff })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, CITY_Y, CITY_CENTER_Z);
    scene.add(ground);

    // světelné kruhy v ulicích pod arénou
    for (const [r, col, op] of [[26, 0x18c8b0, 0.5], [44, 0x6b7cff, 0.35], [66, 0xa06bff, 0.22]]) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.5, 8, 96),

        })

      ring.position.set(0, CITY_Y + 0.4, CITY_CENTER_Z);

  }

  // ---------- Věže ----------
  function windowsTexture(tint) {
    const { c, g } = makeCanvas(128, 256);
    g.fillStyle = '#05070f'; g.fillRect(0, 0, 128, 256);
    for (let y = 6; y < 250; y += 12) {
      for (let x = 8; x < 122; x += 12) {
        if (Math.random() < 0.42) continue;
        const a = 0.35 + Math.random() * 0.65;
        g.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${a.toFixed(2)})`;
        g.fillRect(x, y, 6, 7);
      }
    }
    g.fillStyle = 'rgba(160,220,255,.12)';
    g.fillRect(0, 0, 3, 256); g.fillRect(125, 0, 3, 256);
    // zapečený přechod, aby budovy bez osvětlení nebyly úplně placaté

  // Po ručně navržených kolech pokračuje hra generovanými vzory.
  // Generátor je deterministický – stejné kolo vypadá vždy stejně.
  function levelRandom(seed) {
    let x = (seed * 1103515245 + 12345) >>> 0;
    return () => {
      x = (x * 1103515245 + 12345) >>> 0;
      return ((x >>> 8) % 100000) / 100000;
    };
  }

  function generatePattern(n) {
    const rnd = levelRandom(n * 7919);
    const rows = 5 + (n % 3);
    const hardest = Math.min(3, 1 + Math.floor((n - LEVELS.length) / 4));
    const solidChance = Math.min(0.12, 0.03 * (n - LEVELS.length));
    const out = [];
    let breakable = 0;
    for (let j = 0; j < rows; j++) {
      let half = '';
      for (let i = 0; i < COLS / 2; i++) {
        const r = rnd();
        let ch;
        if (r < 0.13) ch = '.';
        else if (r < 0.13 + solidChance) ch = 'X';
        else if (r < 0.20 + solidChance) ch = 'E';
        else ch = String(1 + Math.floor(rnd() * hardest));
        if (ch !== '.' && ch !== 'X') breakable++;
        half += ch;
      }
      out.push(half + half.split('').reverse().join(''));
    }
    if (!breakable) out[rows - 1] = '22222222';
    return out;
  }

  function makeImpulse(seconds, decay) {
    const len = Math.floor(audioCtx.sampleRate * seconds);
    const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
