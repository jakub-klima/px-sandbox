name: Overpass probe (dočasné měření pro Pxplore)

on:
  push:
    branches: [ccr-56b863cf-ubvl25]
    paths: [.github/workflows/overpass-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vector tiles round 4 – full class list
        run: |
          set +e
          pip install -q mapbox-vector-tile >/dev/null 2>&1
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36'
          curl -sS -m 20 -A "$UA" https://tiles.openfreemap.org/planet -o tj.json
          T=$(python3 -c "import json;print(json.load(open('tj.json'))['tiles'][0])")
          echo "template $T"
          U=$(echo "$T" | sed 's/{z}/14/;s/{x}/8848/;s/{y}/5550/')
          curl -sS -m 20 -A "$UA" -H 'Accept-Encoding: gzip, br' -D h.txt -o t.bin "$U" -w "HTTP %{http_code} %{time_total}s %{size_download}B\n"
          cat h.txt
          curl -sS -m 20 -A "$UA" -o raw.pbf --compressed "$U"
          curl -sS -m 20 -A "$UA" -o /dev/null -w "404 check (old version): HTTP %{http_code}\n" "https://tiles.openfreemap.org/planet/20200101_000000_pt/14/8848/5550.pbf"
          curl -sS -m 20 -A "$UA" -o /dev/null -w "z15 check: HTTP %{http_code}\n" "$(echo "$T" | sed 's/{z}/15/;s/{x}/17696/;s/{y}/11100/')"
          python3 - <<'EOF'
          import mapbox_vector_tile, collections
          d = open('raw.pbf','rb').read()
          if d[:2] == b'\x1f\x8b':
              import gzip; d = gzip.decompress(d); print('body is gzip-wrapped')
          t = mapbox_vector_tile.decode(d)
          poi = t['poi']['features']
          print('extent', t['poi'].get('extent'))
          c = collections.Counter((f['properties'].get('class'), f['properties'].get('subclass')) for f in poi)
          for k, v in sorted(c.items(), key=lambda kv: -kv[1]):
              print(v, k)
          keys = collections.Counter(k for f in poi for k in f['properties'])
          print('keys:', keys.most_common())
          print('with id:', sum(1 for f in poi if f.get('id')))
          for f in poi:
              p = f['properties']
              if p.get('class') in ('castle', 'monument', 'memorial', 'historic', 'fountain', 'museum', 'attraction') and p.get('name'):
                  print('  ', p.get('class'), p.get('subclass'), p.get('name'), p.get('rank'), f['geometry']['coordinates'])
          EOF
